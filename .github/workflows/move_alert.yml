name: Scanner 7 Move Alert

on:
  schedule:
    - cron: "*/10 3-18 * * *"      # 8:30 AM - ~midnight IST, every 10 min
    - cron: "*/30 0-2,19-23 * * *" # off-hours (crypto), every 30 min
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: move-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python move_alert.py --test
          else
            python move_alert.py
          fi
      - name: Save state
        run: |
          git config user.name "move-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
